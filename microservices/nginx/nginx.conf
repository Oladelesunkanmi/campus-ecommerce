upstream auth { server auth:8000; keepalive 32; }
upstream product { server product:8000; keepalive 32; }
upstream cart { server cart:8000; keepalive 32; }
upstream order { server order:8000; keepalive 32; }
upstream payment { server payment:8000; keepalive 32; }

server {
    listen 8000;

    location /products/internal/ { return 404; }
    location /cart/internal/ { return 404; }
    location /payments/internal/ { return 404; }

    location /auth/ {
        proxy_pass http://auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /products {
        proxy_pass http://product;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /cart {
        proxy_pass http://cart;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /orders {
        proxy_pass http://order;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /payments {
        proxy_pass http://payment;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
