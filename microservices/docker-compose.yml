services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c fsync=on
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  nginx:
    image: nginx:1.27.4
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      product:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64m

  auth:
    build: ./auth
    environment:
      DATABASE_URL: postgresql+asyncpg://campus:campus@db:5432/auth_db
      BCRYPT_ROUNDS: "10"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      DB_POOL_TIMEOUT: "30"
      JWT_SECRET: change-me-in-production
      JWT_EXPIRY_MINUTES: "60"
      LOG_LEVEL: warning
      WORKERS: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 200m

  product:
    build: ./product
    environment:
      DATABASE_URL: postgresql+asyncpg://campus:campus@db:5432/product_db
      BCRYPT_ROUNDS: "10"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      DB_POOL_TIMEOUT: "30"
      JWT_SECRET: change-me-in-production
      JWT_EXPIRY_MINUTES: "60"
      LOG_LEVEL: warning
      WORKERS: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 300m

  cart:
    build: ./cart
    environment:
      WORKERS: "1"
      LOG_LEVEL: warning
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 250m

  order:
    build: ./order
    environment:
      WORKERS: "1"
      LOG_LEVEL: warning
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 400m

  payment:
    build: ./payment
    environment:
      WORKERS: "1"
      LOG_LEVEL: warning
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 200m
